name=espdisp_board
version=1.1.0
author=esp32-display
maintainer=esp32-display
sentence=Board variant table and shared panel bring-up for the supported Waveshare ESP32 display boards.
paragraph=board_config.h is the single source of truth for which board the firmware is running on and every pin, driver, panel dimension, and bus setting that follows (two ESP32-C6 1.47-inch LCDs and four exact ESP32-S3 targets including the 0.85-inch GC9107 and 1.54-inch ST7789 LCDs). panel_init.h is the shared esp_lcd bring-up so display_stream and display_test construct the panel identically. board_config.h is hardware-free and unit tested on the host by firmware/test/run_tests.sh.
category=Device Control
architectures=esp32
depends=esp_lcd_jd9853,esp_lcd_co5300,esp_lcd_st77916,esp_lcd_gc9107
