name=espdisp_board
version=1.0.0
author=esp32-display
maintainer=esp32-display
sentence=Board variant table and shared panel bring-up for the two Waveshare 1.47" ESP32-C6 boards.
paragraph=board_config.h is the single source of truth for which board the firmware is running on and every pin, driver, and panel setting that follows. panel_init.h is the shared esp_lcd bring-up so display_stream and display_test construct the panel identically. board_config.h is hardware-free and unit tested on the host by firmware/test/run_tests.sh.
category=Device Control
architectures=esp32
depends=esp_lcd_jd9853
