[audio]
# ES8311 DAC (0x18) -> NS4150B (PA_CTRL GPIO7, active high); two analog
# microphones into ES7210 (0x40). One shared I2S bus. Parts and nets:
# https://files.waveshare.com/wiki/ESP32-S3-LCD-0.85/ESP32-S3-LCD-0.85-Schematic.pdf
# I2S pins, PA_CTRL and 16 kHz rates: Waveshare BSP,
# https://github.com/waveshareteam/ESP32-S3-LCD-0.85/blob/b61ab4c443c0277843b79aaecfc916d11af67dc2/example/ESP-IDF-5.5.1/01_factory/ESP32-S3-LCD-0.85/components/esp_bsp/bsp_codec.c#L24-L32
# Codec I2C bus SDA GPIO42 / SCL GPIO41 (no touch on this board, so it is
# declared here):
# https://github.com/waveshareteam/ESP32-S3-LCD-0.85/blob/b61ab4c443c0277843b79aaecfc916d11af67dc2/example/ESP-IDF-5.5.1/01_factory/ESP32-S3-LCD-0.85/components/esp_bsp/bsp_i2c.h#L5-L6
# The vendor captures 4-slot TDM (MIC3/4 are the amp's echo reference); this
# row uses the 1.75C's two-slot standard I2S for MIC1/MIC2. The product photo
# labels one microphone, so the second footprint may be unpopulated.
amp = "ns4150b"
codec = "es8311"
mic = "es7210"
speaker_bus = "i2s"
mic_bus = "i2s"
pin_playback_mclk = 8
pin_playback_bclk = 9
pin_playback_lrck = 10
pin_dout = 12
pin_capture_mclk = 8
pin_capture_bclk = 9
pin_capture_lrck = 10
pin_din = 11
pin_pdm_clock = -1
pin_amp_enable = 7
codec_i2c_address = 24
mic_i2c_address = 64
playback_rate_hz = 16000
playback_channels = 2
capture_rate_hz = 16000
capture_channels = 2
pin_control_sda = 42
pin_control_scl = 41
# Speaker DAC level: the lowest playback default in the vendor code, the
# Arduino demo's es8311_voice_volume_set(75) (register 0x32 = 191, 0 dB). The
# factory firmware plays at esp_codec_dev 100 (198, +3.5 dB).
# https://github.com/waveshareteam/ESP32-S3-LCD-0.85/blob/b61ab4c443c0277843b79aaecfc916d11af67dc2/example/Arduino-3.2.0/examples/01_i2s_audio/01_i2s_audio.ino#L53
# https://github.com/waveshareteam/ESP32-S3-LCD-0.85/blob/b61ab4c443c0277843b79aaecfc916d11af67dc2/example/ESP-IDF-5.5.1/01_factory/ESP32-S3-LCD-0.85/main/main.c#L244
# The sender scales its samples down from this level; nothing raises it.
dac_volume_percent = 75

[capabilities]
doom = true
audio = true

[compile]
selector = ""
macros = []

[detection]
order = 10
resolution = "exactly_one"
no_match = "unknown"
kind = "flash_range"
flash_min_exclusive = 0
flash_max_inclusive = 8388608
sda = -1
scl = -1
frequency_hz = 0
scan_first = 0
scan_last = 0
addresses = []
reset_pin = -1
reset_low_ms = 0
reset_release_wait_ms = 0
release = "never"
