schema = 1
key = "p4-wifi6-touch-lcd-34c"
catalog_order = 12
name = "ESP32-P4-WIFI6-Touch-LCD-3.4C (JD9365)"
hardware = ["ESP32-P4-WIFI6-Touch-LCD-3.4C"]

[migration]
firmware_config = "legacy"
config_symbol = "CONFIG_P4_34C"

[identity]
target = "p4"
chip = "esp32p4"
profile = "jd9365-34c"
partition = "p4-32m-ota"
variant = "P4_34C"
variant_value = 13
legacy_targets = []

[family]
platform_key = "p4"
build_target = "p4-4b"
fqbn = "esp32:esp32:esp32p4:USBMode=default,CDCOnBoot=default,UploadMode=default,FlashSize=32M,PartitionScheme=custom,PSRAM=enabled,ChipVariant=prev3"
partition_csv = "partitions_p4_4b.csv"
extra_flags = ["-DESPDISP_BOARD_P4_4B", "-DESPDISP_DOOM_RUNTIME"]
extra_library_dirs = ["firmware"]
fqbn_options = ["UploadSpeed=460800"]
flash_bytes = [33554432]
common_layout_bytes = 33554432
requires_doom_wad = true
bootloader_address = 8192
partitions_address = 32768
boot_app0_address = 57344
app_address = 65536
blurb = "Universal ESP32-P4 display firmware"

[platform]
use_psram_frame_buffers = true
use_raw_lwip_receive_task = true
wifi = "hosted_coprocessor"
identity_source = "efuse_base_mac"
serial = "uart_bridge"

[capacity]
minimum_flash_bytes = 33554432

[panel]
symbol = "PANEL_JD9365_800X800"
profile = "Jd9365_800x800"
driver = "Jd9365"
bus = "mipi_dsi"
width = 800
height = 800
memory_width = 0
memory_height = 0
pixel_clock_hz = 80000000
spi_mode = 0
col_offset = 0
row_offset = 0
orientation_offset = 0
invert_color = false
round_display = true
supports_command_rotation = true
color_order = "rgb"
data_endian = "big"
pixel_depth = 16
dsi_data_lanes = 2
dsi_lane_mbps = 1500
hsync_back_porch = 20
hsync_pulse_width = 20
hsync_front_porch = 40
vsync_back_porch = 12
vsync_pulse_width = 4
vsync_front_porch = 24

[carrier]
pin_sclk = -1
pin_mosi = -1
pin_data1 = -1
pin_data2 = -1
pin_data3 = -1
pin_cs = -1
pin_dc = -1
pin_rst = 27
pin_bl = 26
pin_boot = 35
pin_rgb_led = -1

[touch]
controller = "gt911"
sda = 7
scl = 8
reset = -1
interrupt = -1
addresses = [93, 20]
panel_short = 800
panel_long = 800
raw_x_mirrored = false
raw_y_mirrored = false
rotate_clockwise = true

[led]
channel_order = "rgb"
pixel_count = 0

[gesture]
swipe_min_px = 24
tap_max_move_px = 12
tap_max_ms = 400
long_press_ms = 600
press_max_ms = 10000

[orientation]
offsets = [[0, 0], [0, 0], [0, 0], [0, 0]]
mirror_x_supported = false
quarter_turns = [0, 1, 2, 3]

[motion]
controller = "none"
address = 0
x_axis = 0
x_sign = 1
y_axis = 1
y_sign = 1

[reset]
expander = "none"
expander_address = 0
panel_output = 0
touch_output = 0

[backlight]
kind = "dsi_pwm"
enable_pin = 33
inverted = true
# The PWM feeds the AP3032 boost's feedback node, so low duty shuts the boost
# off: a lit level below the floor is raised to it.
# The 4C's XC carrier, so the 4B's floor as the 4C has; not yet run on 3.4C
# hardware.
floor_permille = 510

[power]
controller = "none"
battery_adc = -1
battery_adc_scale = 0
battery_enable = -1
charge_status = -1
axp_address = 0

[serial]
transport = "uart_bridge"
bridge = "ch343"
rx = -1
tx = -1

[audio]
# The 4C's audio, unchanged: the 3.4C wiki links the same XC schematic, and the
# XC BSP defines its audio pins for both panel types. Not checked on a 3.4C.
# Same audio wiring as the 4B:
# ES8311 DAC (0x18) -> NS4150B (GPIO53, 10K pull-down, active high); two
# analog microphones into ES7210 (0x40). One I2S bus; the codecs share the
# GT911's I2C bus (SDA GPIO7 / SCL GPIO8). Parts and nets: schematic page 1,
# https://files.waveshare.com/wiki/ESP32-P4-WIFI6-Touch-LCD-XC/ESP32-P4-WIFI6-Touch-LCD-XC-Schematic.pdf
# Pins and amp polarity: Waveshare BSP,
# https://github.com/waveshareteam/Waveshare-ESP32-components/blob/30d0ac3b8b6b27ebd402c5852819cbe0dab92749/bsp/esp32_p4_wifi6_touch_lcd_xc/include/bsp/esp32_p4_wifi6_touch_lcd_xc.h#L34-L44
# https://github.com/waveshareteam/Waveshare-ESP32-components/blob/30d0ac3b8b6b27ebd402c5852819cbe0dab92749/bsp/esp32_p4_wifi6_touch_lcd_xc/esp32_p4_wifi6_touch_lcd_xc.c#L698-L710
# (The BSP header comment says ES8311 records; its code and the schematic
# record through ES7210.)
amp = "ns4150b"
codec = "es8311"
mic = "es7210"
speaker_bus = "i2s"
mic_bus = "i2s"
pin_playback_mclk = 13
pin_playback_bclk = 12
pin_playback_lrck = 10
pin_dout = 9
pin_capture_mclk = 13
pin_capture_bclk = 12
pin_capture_lrck = 10
pin_din = 11
pin_pdm_clock = -1
pin_amp_enable = 53
codec_i2c_address = 24
mic_i2c_address = 64
playback_rate_hz = 16000
playback_channels = 2
capture_rate_hz = 16000
capture_channels = 2
# Speaker DAC level: the lowest playback default in the vendor code for the
# XC boards (4C and 3.4C), the I2SCodec example's es8311_voice_volume_set(60)
# (register 0x32 = 152, -19.5 dB). The factory firmware plays at
# esp_codec_dev 80 (178, -6.5 dB).
# https://github.com/waveshareteam/ESP32-P4-WIFI6-Touch-LCD-XC/blob/6948676d64515b6273998236d98a643ead640735/examples/esp-idf/06_I2SCodec/main/Kconfig.projbuild#L52-L55
# https://github.com/waveshareteam/ESP32-P4-WIFI6-Touch-LCD-XC/blob/6948676d64515b6273998236d98a643ead640735/firmware/brookesia/main/main.cpp#L501
# The sender scales its samples down from this level; nothing raises it.
dac_volume_percent = 60

[capabilities]
doom = true
audio = true

[compile]
selector = ""
macros = []

[detection]
order = 12
resolution = "exactly_one"
no_match = "unknown"
kind = "dsi_panel_id"
flash_min_exclusive = 0
flash_max_inclusive = 0
sda = -1
scl = -1
frequency_hz = 0
scan_first = 0
scan_last = 0
addresses = []
reset_pin = 27
reset_low_ms = 10
reset_release_wait_ms = 120
release = "never"
# GPIO52 is a floating 40-pin header pin here and reads low with the internal
# pull-down; the 4B's PHY pull-up would read high. Input only.
sense_pin = 52
sense_max_mv = 1650
# The same JD9365 as the 4C (vendor BSP), so the same ID is expected; it is
# not measured on a 3.4C here.
panel_id = [0x93, 0x65, 0x04]
# Only the GT9271's stored config resolution tells this glass from the 4C's.
# The vendor driver reports raw coordinates against x_max = 800 without
# writing the controller's config, so the controller must store 800x800.
touch_resolution = [800, 800]
