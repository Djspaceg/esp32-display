schema = 1
key = "s3-xiao-bare"
catalog_order = 6
name = "XIAO ESP32-S3 (no screen)"
hardware = ["Seeed Studio XIAO ESP32S3"]

# A bare Seeed XIAO ESP32-S3 used as a development board: the same module as
# the screen XIAO (s3-xiao-tft-042), with nothing attached. esptool on the
# unit here: "ESP32-S3 (QFN56) (revision v0.2)", "Embedded PSRAM 8MB
# (AP_3v3)", 8 MB quad flash (GigaDevice c8/4017), native USB-Serial/JTAG.
# It has no screen, no touch and no user buttons: only the BOOT (B) and
# RESET (R) keys, and BOOT is left alone because everything the firmware does
# with it (the boot menu, the WiFi screens, games) needs a screen. The user LED
# on GPIO21 is a plain LED, not an addressable one, and is left alone too.
# It runs the s3 image headless: WiFi and its setup, the serial command set,
# OTA and stream-channel updates, and USB flashing.

[migration]
firmware_config = "legacy"
config_symbol = "CONFIG_XIAO_S3_BARE"

[identity]
target = "s3"
chip = "esp32s3"
profile = "xiao-s3-bare"
partition = "universal-8m-doom-saves-ota"
variant = "XiaoS3Bare"
variant_value = 17
legacy_targets = []

[family]
platform_key = "s3"
build_target = "s3-universal"
fqbn = "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,PartitionScheme=custom"
partition_csv = "partitions_s3.csv"
extra_flags = ["-DESPDISP_DOOM_RUNTIME"]
extra_library_dirs = ["firmware"]
fqbn_options = []
flash_bytes = [8388608, 16777216, 33554432]
common_layout_bytes = 8388608
requires_doom_wad = true
bootloader_address = 0
partitions_address = 32768
boot_app0_address = 57344
app_address = 65536
blurb = "Universal ESP32-S3 display firmware"

[platform]
use_psram_frame_buffers = true
use_raw_lwip_receive_task = true
wifi = "native"
identity_source = "wifi_station_mac"
serial = "native_usb_cdc"

[capacity]
minimum_flash_bytes = 8388608

[panel]
# No panel. bus "none" says so; every other panel field holds its empty
# value, and the firmware's Config for this board carries no PanelConfig.
symbol = "PANEL_NONE"
profile = "None"
driver = "None"
bus = "none"
width = 0
height = 0
memory_width = 0
memory_height = 0
pixel_clock_hz = 0
spi_mode = 0
col_offset = 0
row_offset = 0
orientation_offset = 0
invert_color = false
round_display = false
supports_command_rotation = false
color_order = "rgb"
data_endian = "big"
pixel_depth = 16
dsi_data_lanes = 0
dsi_lane_mbps = 0
hsync_back_porch = 0
hsync_pulse_width = 0
hsync_front_porch = 0
vsync_back_porch = 0
vsync_pulse_width = 0
vsync_front_porch = 0

[carrier]
panel_diagonal_tenths_mm = 0
pin_sclk = -1
pin_mosi = -1
pin_data1 = -1
pin_data2 = -1
pin_data3 = -1
pin_cs = -1
pin_dc = -1
pin_rst = -1
pin_bl = -1
pin_boot = -1
pin_rgb_led = -1

[touch]
controller = "none"
sda = -1
scl = -1
reset = -1
interrupt = -1
addresses = []
panel_short = 0
panel_long = 0
raw_x_mirrored = false
raw_y_mirrored = false
rotate_clockwise = false

[led]
channel_order = "rgb"
pixel_count = 0

[gesture]
swipe_min_px = 24
tap_max_move_px = 12
tap_max_ms = 400
long_press_ms = 600
press_max_ms = 10000

[orientation]
offsets = [[0, 0], [0, 0], [0, 0], [0, 0]]
mirror_x_supported = false
quarter_turns = [0]

[motion]
controller = "none"
address = 0
x_axis = 0
x_sign = 1
y_axis = 1
y_sign = 1

[reset]
expander = "none"
expander_address = 0
panel_output = 0
touch_output = 0

[backlight]
kind = "none"
enable_pin = -1
inverted = false

[power]
controller = "none"
battery_adc = -1
battery_adc_scale = 0
battery_enable = -1
charge_status = -1
axp_address = 0

[serial]
transport = "native_usb_cdc"
bridge = "none"
rx = -1
tx = -1

[audio]
amp = "none"
codec = "none"
mic = "none"
speaker_bus = "none"
mic_bus = "none"
pin_playback_mclk = -1
pin_playback_bclk = -1
pin_playback_lrck = -1
pin_dout = -1
pin_capture_mclk = -1
pin_capture_bclk = -1
pin_capture_lrck = -1
pin_din = -1
pin_pdm_clock = -1
pin_amp_enable = -1
codec_i2c_address = 0
mic_i2c_address = 0
playback_rate_hz = 0
playback_channels = 0
capture_rate_hz = 0
capture_channels = 0

[capabilities]
# The s3 image carries Doom, but Doom needs a screen.
doom = false
audio = false

[compile]
selector = ""
macros = []

[detection]
# The screen XIAO's probe, with the opposite panel answer. The 0.85's codec
# bus is silent here as on the screen XIAO; what tells the two apart is the
# screen XIAO's ST7735, which answers an RDDID read on its SDA line (GPIO9)
# when the line is left floating. On this board nothing drives GPIO9, so the
# read returns only the level the host last left on it (measured: 00000000
# at 2, 20 and 200 us per bit; the screen XIAO's bench unit reads 41BB07FF).
order = 85
resolution = "exactly_one"
no_match = "unknown"
kind = "i2c_no_ack"
flash_min_exclusive = 0
flash_max_inclusive = 8388608
sda = 42
scl = 41
frequency_hz = 100000
scan_first = 0
scan_last = 0
addresses = [24, 64]
reset_pin = -1
reset_low_ms = 0
reset_release_wait_ms = 0
release = "always"
panel_readback = "silent"
