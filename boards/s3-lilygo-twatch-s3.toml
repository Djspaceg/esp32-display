schema = 1
key = "s3-lilygo-twatch-s3"
catalog_order = 80
name = "LilyGO T-Watch-S3 (ST7789V3)"
hardware = ["LilyGO T-Watch-S3"]

# Sources, every pin and part below is from LilyGO's own publications:
#   [W] Wiki: https://wiki.lilygo.cc/products/t-watch-series/t-watch-s3/
#       source at https://github.com/Xinyuan-LilyGO/documentation/blob/d494a8221df8e7d3edf012ccbf80aa7b41dea45c/en/products/t-watch-series/t-watch-s3/index.md
#   [L] LilyGoLib, LilyGO's current watch library, at 7afa3e3:
#       https://github.com/Xinyuan-LilyGO/LilyGoLib/blob/7afa3e36bd37184fb5d6d7d600c4ee9147e2cf5f/docs/hardware/lilygo-t-watch-s3.md
#       https://github.com/Xinyuan-LilyGO/LilyGoLib/blob/7afa3e36bd37184fb5d6d7d600c4ee9147e2cf5f/src/LilyGoWatchS3.cpp
#       https://github.com/Xinyuan-LilyGO/LilyGoLib/blob/7afa3e36bd37184fb5d6d7d600c4ee9147e2cf5f/src/display/LilyGoDispInterface.cpp
#   [T] TTGO_TWatch_Library, branch t-watch-s3, at 9884d62:
#       https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library/blob/9884d62113cd2f7aa77cd179c346b9017eb08301/src/utilities.h#L115-L164
#       https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library/blob/9884d62113cd2f7aa77cd179c346b9017eb08301/extras/Setup212_LilyGo_T_Watch_S3.h
#   [S] Schematic Rev V1.4, the one the wiki links:
#       https://github.com/Xinyuan-LilyGO/TTGO_TWatch_Library/blob/9884d62113cd2f7aa77cd179c346b9017eb08301/schematic/T_WATCH_S3.pdf
# ESP32-S3-R8 (8 MB octal PSRAM), 16 MB flash, native USB Serial/JTAG
# ([L] doc #L34-L35; [S]). Measured on the attached watch with esptool: S3
# rev v0.2, 8 MB embedded PSRAM, 16 MB flash (ef/4018).
#
# "R251": no LilyGO source uses that name. The nearest is the store SKU K251,
# the 2.4 GHz (SX1280 LoRa) gun-metal model; LilyGO documents no revision
# that changes the screen, touch, PMU or their pins, and the radio is not
# driven here. The only batch differences LilyGO names are the IMU (BMA423
# or BMA456, [L] doc #L60) and the GPS rail (BLDO1 or DC3, [L]
# LilyGoWatchS3.cpp#L507-L513); neither is used by this firmware.

[migration]
firmware_config = "legacy"
config_symbol = "CONFIG_LILYGO_TWATCH_S3"

[identity]
target = "s3"
chip = "esp32s3"
profile = "st7789-twatch"
partition = "universal-8m-doom-saves-ota"
variant = "LilygoTwatchS3"
variant_value = 15
legacy_targets = []

[family]
platform_key = "s3"
build_target = "s3-universal"
fqbn = "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,PartitionScheme=custom"
partition_csv = "partitions_s3.csv"
extra_flags = ["-DESPDISP_DOOM_RUNTIME"]
extra_library_dirs = ["firmware"]
fqbn_options = []
flash_bytes = [8388608, 16777216, 33554432]
common_layout_bytes = 8388608
requires_doom_wad = true
bootloader_address = 0
partitions_address = 32768
boot_app0_address = 57344
app_address = 65536
blurb = "Universal ESP32-S3 display firmware"

[platform]
use_psram_frame_buffers = true
use_raw_lwip_receive_task = true
wifi = "native"
identity_source = "wifi_station_mac"
serial = "native_usb_cdc"

[capacity]
minimum_flash_bytes = 16777216

# ST7789V3 1.54-inch 240x240 IPS ([L] doc #L64-L73) over 4-wire SPI, mode 0
# ([L] LilyGoDispInterface.cpp#L571), RGB order (#L587), inversion on
# (#L678; [T] Setup212 #L9). 40 MHz is [T]'s TFT_eSPI SPI_FREQUENCY (#L33);
# LilyGoLib drives 80 MHz (LilyGoWatchS3.cpp#L222), so 40 is the lower of
# LilyGO's own two. Memory is 240x320: LilyGO's setRotation() puts a gap of
# 80 rows under MX|MY and 80 columns under MV|MY and none otherwise
# (LilyGoDispInterface.cpp#L717-L743), the far-end window rule
# (window_follows_mirror). LilyGoLib's upright rotation 0 is MX|MY
# (LilyGoWatchS3.cpp#L277), which is this firmware's quadrant 2, hence
# orientation_offset 2; [T]'s TFT_eSPI setRotation(2) is the same MADCTL.
[panel]
symbol = "PANEL_ST7789V3_240X240"
profile = "St7789V3_240x240"
driver = "St7789"
bus = "spi"
width = 240
height = 240
memory_width = 240
memory_height = 320
pixel_clock_hz = 40000000
spi_mode = 0
col_offset = 0
row_offset = 0
orientation_offset = 2
invert_color = true
round_display = false
supports_command_rotation = true
color_order = "rgb"
data_endian = "big"
pixel_depth = 16
dsi_data_lanes = 0
dsi_lane_mbps = 0
hsync_back_porch = 0
hsync_pulse_width = 0
hsync_front_porch = 0
vsync_back_porch = 0
vsync_pulse_width = 0
vsync_front_porch = 0
window_follows_mirror = true

# SCLK GPIO18, MOSI GPIO13, CS GPIO12, DC GPIO38; MISO and RESET "Not
# Connected" ([T] utilities.h#L119-L126; [L] doc #L101-L107). [S]: the
# panel's RST is an RC network on its supply (R35 4K7, C64 1uF), TE unused.
# Backlight GPIO45, LEDC PWM ([L] LilyGoDispInterface.cpp#L692-L709), into
# the base of NPN Q14 with a 10K pull-down, so active high ([S]). BOOT is
# GPIO0 (switch S1, 10K pull-up, [S]; [W] "POWER ... + BOOT (built-in)").
# The crown is the AXP2101 PWR key, which this firmware reads as the PWR
# key input. No addressable LED.
[carrier]
pin_sclk = 18
pin_mosi = 13
pin_data1 = -1
pin_data2 = -1
pin_data3 = -1
pin_cs = 12
pin_dc = 38
pin_rst = -1
pin_bl = 45
pin_boot = 0
pin_rgb_led = -1

# FT6336U at 0x38 alone on SDA GPIO39 / SCL GPIO40, INT GPIO16 falling, no
# reset line ([L] doc #L81-L84, #L121; [T] utilities.h#L128-L131). LilyGO
# puts it in interrupt trigger mode and reads coordinates without swap or
# mirror at its upright rotation ([L] LilyGoWatchS3.cpp#L342-L355,
# #L1058-L1082). Its supply and pull-ups are ALDO3 ([S]).
[touch]
controller = "ft6336"
sda = 39
scl = 40
reset = -1
interrupt = 16
addresses = [56]
panel_short = 240
panel_long = 240
raw_x_mirrored = false
raw_y_mirrored = false
rotate_clockwise = true

[led]
channel_order = "rgb"
pixel_count = 0

[gesture]
swipe_min_px = 24
tap_max_move_px = 12
tap_max_ms = 400
long_press_ms = 600
press_max_ms = 10000

# Window gap per rotation 0..3 (quadrants 2, 3, 0, 1), LilyGO's table.
[orientation]
offsets = [[0, 80], [80, 0], [0, 0], [0, 0]]
mirror_x_supported = true
quarter_turns = [0, 1, 2, 3]

# BMA423 (BMA456 on later batches) at 0x19 on the main bus, INT1 GPIO14
# ([L] doc #L37, #L88, #L122). This firmware has no BMA4xx driver, so no
# automatic rotation.
[motion]
controller = "none"
address = 0
x_axis = 0
x_sign = 1
y_axis = 1
y_sign = 1

[reset]
expander = "none"
expander_address = 0
panel_output = 0
touch_output = 0

[backlight]
kind = "pwm"
enable_pin = -1
inverted = false

# AXP2101 at 0x34 on the main bus SDA GPIO10 / SCL GPIO11, beside the BMA423
# (0x19), PCF8563 RTC (0x51, INT GPIO17) and DRV2605 haptics (0x5A, EN from
# BLDO2) ([L] doc #L121-L125; [T] utilities.h#L133-L140). IRQ GPIO21 is not
# used (the PWR key is polled). Rails ([L] LilyGoWatchS3.cpp#L446-L466 and
# [S]): DC1 the ESP32-S3 and the main-bus sensors; ALDO2 the backlight LED
# anode (LCD_VDD); ALDO3 the panel logic, the FT6336U and its pull-ups;
# ALDO4 the radio; BLDO2 the DRV2605 enable; DLDO1 the speaker amplifier.
# LilyGO sets ALDO2 and ALDO3 to 3300 mV and enables them
# (LilyGoWatchS3.cpp#L493-L498); panel bring-up does exactly that and touches
# no other rail. LilyGO sets the VBUS input limit to 900 mA (#L487), so the
# firmware raises it no further than that. Charge current (125 mA, LilyGO
# warns not to exceed it) is never written by this firmware.
[power]
controller = "axp2101"
battery_adc = -1
battery_adc_scale = 0
battery_enable = -1
charge_status = -1
axp_address = 52
sda = 10
scl = 11
panel_rails = ["aldo2", "aldo3"]
input_limit_ma = 900

[serial]
transport = "native_usb_cdc"
bridge = "none"
rx = -1
tx = -1

[audio]
# A MAX98357A I2S amplifier (BCLK GPIO48, LRCK GPIO15, DOUT GPIO46; no
# enable GPIO, powered from DLDO1) and an SPM1423 PDM microphone (CLK GPIO44,
# DATA GPIO47, 16 kHz) ([T] utilities.h#L147-L164; [S]). This firmware's
# audio backend drives ES8311/ES7210 codecs only, so no audio is declared and
# DLDO1 stays as LilyGO left it.
amp = "none"
codec = "none"
mic = "none"
speaker_bus = "none"
mic_bus = "none"
pin_playback_mclk = -1
pin_playback_bclk = -1
pin_playback_lrck = -1
pin_dout = -1
pin_capture_mclk = -1
pin_capture_bclk = -1
pin_capture_lrck = -1
pin_din = -1
pin_pdm_clock = -1
pin_amp_enable = -1
codec_i2c_address = 0
mic_i2c_address = 0
playback_rate_hz = 0
playback_channels = 0
capture_rate_hz = 0
capture_channels = 0

[capabilities]
doom = true
audio = false

[compile]
selector = ""
macros = []

# The always-powered main bus: the AXP2101 (0x34), BMA4xx (0x19) and PCF8563
# (0x51) run from the PMU's DC1, so they answer with every ALDO off. No other
# S3 carrier puts a device on SDA GPIO10 / SCL GPIO11 (the 1.85C's bus is
# those pins the other way round, SDA GPIO11 / SCL GPIO10, which its own
# earlier probe already drives on every board). Ordered right after the
# 1.85C and before the 1.75C and the knob, so once the watch answers, the
# quiet probes that would pull up its GPIO14/15 and pulse its GPIO1 are
# skipped.
[detection]
order = 17
resolution = "exactly_one"
no_match = "unknown"
kind = "i2c_any_ack"
flash_min_exclusive = 8388608
flash_max_inclusive = 0
sda = 10
scl = 11
frequency_hz = 100000
scan_first = 0
scan_last = 0
addresses = [52, 25, 81]
reset_pin = -1
reset_low_ms = 0
reset_release_wait_ms = 0
release = "always"
