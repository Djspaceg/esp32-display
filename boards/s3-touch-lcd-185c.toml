schema = 1
key = "s3-touch-lcd-185c"
catalog_order = 50
name = "ESP32-S3-Touch-LCD-1.85C (ST77916)"
hardware = ["ESP32-S3-Touch-LCD-1.85C"]

[migration]
firmware_config = "legacy"
config_symbol = "CONFIG_LCD_ST77916"

[identity]
target = "s3"
chip = "esp32s3"
profile = "st77916"
partition = "universal-8m-doom-ota"
variant = "LcdSt77916"
variant_value = 4
legacy_targets = ["s3-185"]

[family]
platform_key = "s3"
build_target = "s3-universal"
fqbn = "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,PartitionScheme=custom"
partition_csv = "partitions_s3.csv"
extra_flags = ["-DESPDISP_DOOM_RUNTIME"]
extra_library_dirs = ["firmware"]
fqbn_options = []
flash_bytes = [8388608, 16777216, 33554432]
common_layout_bytes = 8388608
requires_doom_wad = true
bootloader_address = 0
partitions_address = 32768
boot_app0_address = 57344
app_address = 65536
blurb = "Universal ESP32-S3 display firmware"

[platform]
use_psram_frame_buffers = true
use_raw_lwip_receive_task = true
wifi = "native"
identity_source = "wifi_station_mac"
serial = "native_usb_cdc"

[capacity]
minimum_flash_bytes = 16777216

[panel]
symbol = "PANEL_ST77916_360X360"
profile = "St77916_360x360"
driver = "St77916"
bus = "qspi"
width = 360
height = 360
memory_width = 0
memory_height = 0
pixel_clock_hz = 80000000
spi_mode = 0
col_offset = 0
row_offset = 0
orientation_offset = 0
invert_color = true
round_display = true
supports_command_rotation = true
color_order = "rgb"
data_endian = "big"
pixel_depth = 16
dsi_data_lanes = 0
dsi_lane_mbps = 0
hsync_back_porch = 0
hsync_pulse_width = 0
hsync_front_porch = 0
vsync_back_porch = 0
vsync_pulse_width = 0
vsync_front_porch = 0

[carrier]
pin_sclk = 40
pin_mosi = 46
pin_data1 = 45
pin_data2 = 42
pin_data3 = 41
pin_cs = 21
pin_dc = -1
pin_rst = -1
pin_bl = 5
pin_boot = 0
pin_rgb_led = -1

[touch]
controller = "cst816"
sda = 11
scl = 10
reset = -1
interrupt = 4
addresses = [21]
panel_short = 360
panel_long = 360
raw_x_mirrored = false
raw_y_mirrored = false
rotate_clockwise = true

[led]
channel_order = "rgb"
pixel_count = 0

[gesture]
swipe_min_px = 24
tap_max_move_px = 12
tap_max_ms = 400
long_press_ms = 600
press_max_ms = 10000

[orientation]
offsets = [[0, 0], [0, 0], [0, 0], [0, 0]]
mirror_x_supported = true
quarter_turns = [0, 1, 2, 3]

[motion]
controller = "none"
address = 0
x_axis = 0
x_sign = 1
y_axis = 1
y_sign = 1

[reset]
expander = "tca9554"
expander_address = 32
panel_output = 2
touch_output = 1

[backlight]
kind = "pwm"
enable_pin = -1
inverted = false

[power]
# GPIO8 is the battery sense, through the same 3:1 divider the other
# divider boards use. Confirmed on attached hardware at 3750 mV / 35 percent.
# The divider intermittently returns 0; batteryestimate::selectCellMillivolts
# filters those out by taking the median of the plausible samples, so a run of
# zeros no longer reports a healthy pack as absent.
# GPIO8 is ADC1_CH7, the WiFi-safe ADC unit, and is otherwise unused here.
# No enable line and no charge-status net exist on this design, so charge state
# stays honestly unknown.
controller = "battery_adc"
battery_adc = 8
battery_adc_scale = 3
battery_enable = -1
charge_status = -1
axp_address = 0

[serial]
transport = "native_usb_cdc"
bridge = "none"
rx = -1
tx = -1

[audio]
# V2 only; V1 uses incompatible PCM5101A/NS8002/ICS-43434 hardware.
# Parts and nets: V2 schematic, https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.85C/ESP32-S3-Touch-LCD-1.85C_V2.pdf
# Bus pins and 16 kHz stereo setup: Waveshare ESP-IDF board support,
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.85C/blob/8ead4a96bf3a278fc4ebd8ef4768657e17fa2880/ESP-IDF/ESP32-S3-Touch-LCD-1.85C-Test/components/auido_borad/boards/include/ESP32_S3_AUDIO_Board.h
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.85C/blob/8ead4a96bf3a278fc4ebd8ef4768657e17fa2880/ESP-IDF/ESP32-S3-Touch-LCD-1.85C-Test/components/auido_borad/boards/ESP32_S3_AUDIO_Board/bsp_board.c
# Addresses and capture format: Waveshare Arduino demos,
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.85C/blob/8ead4a96bf3a278fc4ebd8ef4768657e17fa2880/Arduino/examples/05_audio_out_tf/05_audio_out_tf.ino
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.85C/blob/8ead4a96bf3a278fc4ebd8ef4768657e17fa2880/Arduino/examples/03_audio_out_no_tf/es8311.h
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.85C/blob/8ead4a96bf3a278fc4ebd8ef4768657e17fa2880/Arduino/examples/08_esp_sr/08_esp_sr.ino
amp = "ns4150b"
codec = "es8311"
mic = "es7210"
speaker_bus = "i2s"
mic_bus = "i2s"
pin_playback_mclk = 2
pin_playback_bclk = 48
pin_playback_lrck = 38
pin_dout = 47
pin_capture_mclk = 2
pin_capture_bclk = 48
pin_capture_lrck = 38
pin_din = 39
pin_pdm_clock = -1
pin_amp_enable = 15
codec_i2c_address = 24
mic_i2c_address = 64
playback_rate_hz = 16000
playback_channels = 2
capture_rate_hz = 16000
capture_channels = 2

[capabilities]
doom = true
audio = true

[compile]
selector = ""
macros = []

[detection]
order = 30
resolution = "exactly_one"
no_match = "unknown"
kind = "i2c_any_ack"
flash_min_exclusive = 8388608
flash_max_inclusive = 0
sda = 11
scl = 10
frequency_hz = 100000
scan_first = 0
scan_last = 0
addresses = [21, 32]
reset_pin = -1
reset_low_ms = 0
reset_release_wait_ms = 0
release = "always"
