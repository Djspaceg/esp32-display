tx = -1

[audio]
# ES8311 DAC (0x18) -> NS4150B (PA_CTRL GPIO7, active high); two analog
# microphones into ES7210 (0x40). One shared I2S bus; the codecs share the
# touch/IMU I2C bus (SDA GPIO42 / SCL GPIO41). Parts and nets:
# https://files.waveshare.com/wiki/ESP32-S3-Touch-LCD-1.54/ESP32-S3-LCD-1.54-Schematic.pdf
# I2S pins, PA_CTRL, I2C bus and 16 kHz rate: Waveshare Arduino demos,
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.54/blob/5157db7c888e476fd57f8a95020800377447478f/examples/ESP32-S3-Touch-LCD-1.54-demo/Arduino-3.2.0/examples/01_i2s_audio/01_i2s_audio.ino#L11-L23
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.54/blob/5157db7c888e476fd57f8a95020800377447478f/examples/ESP32-S3-Touch-LCD-1.54-demo/Arduino-3.2.0/examples/10_esp_sr/10_esp_sr.ino#L9-L25
# The vendor captures 4-slot TDM (MIC3/4 are the amp's echo reference); this
# row uses the 1.75C's two-slot standard I2S for MIC1/MIC2.
amp = "ns4150b"
codec = "es8311"
mic = "es7210"
speaker_bus = "i2s"
mic_bus = "i2s"
pin_playback_mclk = 8
pin_playback_bclk = 9
pin_playback_lrck = 10
pin_dout = 12
pin_capture_mclk = 8
pin_capture_bclk = 9
pin_capture_lrck = 10
pin_din = 11
pin_pdm_clock = -1
pin_amp_enable = 7
codec_i2c_address = 24
mic_i2c_address = 64
playback_rate_hz = 16000
playback_channels = 2
capture_rate_hz = 16000
capture_channels = 2
# Speaker DAC level: the lowest playback default in the vendor code, the
# Arduino demo's es8311_voice_volume_set(75) (register 0x32 = 191, 0 dB). The
# factory firmware plays at esp_codec_dev 100 (198, +3.5 dB).
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.54/blob/5157db7c888e476fd57f8a95020800377447478f/examples/ESP32-S3-Touch-LCD-1.54-demo/Arduino-3.2.0/examples/01_i2s_audio/01_i2s_audio.ino#L53
# https://github.com/waveshareteam/ESP32-S3-Touch-LCD-1.54/blob/5157db7c888e476fd57f8a95020800377447478f/examples/ESP32-S3-Touch-LCD-1.54-demo/ESP-IDF-5.5.1/01_factory/main/main.c#L238
# The sender scales its samples down from this level; nothing raises it.
dac_volume_percent = 75

[capabilities]
doom = true
audio = true

[compile]
selector = ""
macros = []

[detection]
order = 40
resolution = "exactly_one"
no_match = "unknown"
kind = "i2c_any_ack"
flash_min_exclusive = 8388608
flash_max_inclusive = 0
sda = 42
scl = 41
frequency_hz = 100000
scan_first = 0
scan_last = 0
addresses = [21, 106, 107]
reset_pin = -1
reset_low_ms = 0
reset_release_wait_ms = 0
release = "always"
