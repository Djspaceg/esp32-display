pin_sclk = 38
pin_mosi = 39
pin_data1 = -1
pin_data2 = -1
pin_data3 = -1
pin_cs = 21
pin_dc = 45
pin_rst = 40
pin_bl = 46
pin_boot = 0
pin_rgb_led = -1

[touch]
