schema = 1
key = "s3-elecrow-knob-128"
catalog_order = 70
name = "CrowPanel 1.28 Rotary Knob (GC9A01)"
hardware = ["ELECROW CrowPanel 1.28inch HMI ESP32 Rotary Display", "ELECROW ESP32-S3 1.28 Rotary Round Knob Touch Display"]

# Sources, all at ELECROW's repository commit 4c4d893:
# https://github.com/Elecrow-RD/CrowPanel-1.28inch-HMI-ESP32-Rotary-Display-240-240-IPS-Round-Touch-Knob-Screen
#   Eagle schematic "Eagle_SCH&PCB/ESP32 Display-1.28-V1.0.sch" (nets below)
#   factory_soucecode/RotaryScreen_1_28/RotaryScreen_1_28.ino (pins, LovyanGFX
#   GC9A01 config, power rails) and CST816D.cpp (touch address and reset)
#   example/esphome/Lesson02 (octal PSRAM, GC9A01A, invert_colors)
# Product page and readme: ESP32-S3R8 (8 MB octal PSRAM), 16 MB flash, native
# USB Serial/JTAG on the MX1.25 connector (no bridge IC).

[migration]
firmware_config = "legacy"
config_symbol = "CONFIG_ELECROW_KNOB_128"

[identity]
target = "s3"
chip = "esp32s3"
profile = "gc9a01-knob-128"
partition = "universal-8m-doom-ota"
variant = "ElecrowKnob128"
variant_value = 11
legacy_targets = []

[family]
platform_key = "s3"
build_target = "s3-universal"
fqbn = "esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=8M,PSRAM=opi,PartitionScheme=custom"
partition_csv = "partitions_s3.csv"
extra_flags = ["-DESPDISP_DOOM_RUNTIME"]
extra_library_dirs = ["firmware"]
fqbn_options = []
flash_bytes = [8388608, 16777216, 33554432]
common_layout_bytes = 8388608
requires_doom_wad = true
bootloader_address = 0
partitions_address = 32768
boot_app0_address = 57344
app_address = 65536
blurb = "Universal ESP32-S3 display firmware"

[platform]
use_psram_frame_buffers = true
use_raw_lwip_receive_task = true
wifi = "native"
identity_source = "wifi_station_mac"
serial = "native_usb_cdc"

[capacity]
minimum_flash_bytes = 16777216

# GC9A01 240x240 round IPS over 4-wire SPI with D/C. The vendor LovyanGFX
# config uses mode 0, invert on, default (BGR) order, zero offsets; it writes at
# 80 MHz, while this shared GC9A01 profile keeps the C3 round board's 40 MHz.
[panel]
symbol = "PANEL_GC9107_240X240"
profile = "Gc9107_240x240"
driver = "Gc9107"
bus = "spi"
width = 240
height = 240
memory_width = 240
memory_height = 240
pixel_clock_hz = 40000000
spi_mode = 0
col_offset = 0
row_offset = 0
orientation_offset = 0
invert_color = true
round_display = true
supports_command_rotation = true
color_order = "bgr"
data_endian = "big"
pixel_depth = 16
dsi_data_lanes = 0
dsi_lane_mbps = 0
hsync_back_porch = 0
hsync_pulse_width = 0
hsync_front_porch = 0
vsync_back_porch = 0
vsync_pulse_width = 0
vsync_front_porch = 0

# LCD_CS GPIO9, LCD_CLK GPIO10, LCD SDA GPIO11 (the schematic net is misnamed
# LCD_MISO), D/C GPIO3, RST GPIO14. Backlight GPIO46 drives a low-side N-FET,
# active high, 100K pull-down. The knob push switch is GPIO41 to GND with a 10K
# pull-up, so it takes the BOOT-button role; the chip's own BOOT key (GPIO0)
# stays unassigned because the carrier exposes one button action set.
# GPIO1 switches the LCD-3.3 rail (panel VDD, backlight anode, touch pull-ups)
# and must stay high; GPIO2 switches only the expansion 5 V and is left alone.
# Encoder EC3501: A GPIO45, B GPIO42, common to GND, 10K pull-ups.
# Five WS2812 LEDs (GRB) chain from GPIO48 through a level shifter, and a green
# power LED sinks into GPIO40; neither is driven by this firmware.
[carrier]
pin_sclk = 10
pin_mosi = 11
pin_data1 = -1
pin_data2 = -1
pin_data3 = -1
pin_cs = 9
pin_dc = 3
pin_rst = 14
pin_bl = 46
pin_boot = 41
pin_rgb_led = -1
pin_panel_power = 1
pin_encoder_a = 45
pin_encoder_b = 42

# CST816D at 0x15 on SDA GPIO6 / SCL GPIO7, INT GPIO5, RST GPIO13. The vendor
# driver consumes raw coordinates without swapping or mirroring.
[touch]
controller = "cst816"
sda = 6
scl = 7
reset = 13
interrupt = 5
addresses = [21]
panel_short = 240
panel_long = 240
raw_x_mirrored = false
raw_y_mirrored = false
rotate_clockwise = true

[led]
channel_order = "rgb"
pixel_count = 0

[gesture]
swipe_min_px = 24
tap_max_move_px = 12
tap_max_ms = 400
long_press_ms = 600
press_max_ms = 10000

[orientation]
offsets = [[0, 0], [0, 0], [0, 0], [0, 0]]
mirror_x_supported = true
quarter_turns = [0, 1, 2, 3]

[motion]
controller = "none"
address = 0
x_axis = 0
x_sign = 1
y_axis = 1
y_sign = 1

[reset]
expander = "none"
expander_address = 0
panel_output = 0
touch_output = 0

[backlight]
kind = "pwm"
enable_pin = -1
inverted = false

# No battery, charger, IMU, RTC, buzzer or microSD on this schematic.
[power]
controller = "none"
battery_adc = -1
battery_adc_scale = 0
battery_enable = -1
charge_status = -1
axp_address = 0

[serial]
transport = "native_usb_cdc"
bridge = "none"
rx = -1
tx = -1

[audio]
amp = "none"
codec = "none"
mic = "none"
speaker_bus = "none"
mic_bus = "none"
pin_playback_mclk = -1
pin_playback_bclk = -1
pin_playback_lrck = -1
pin_dout = -1
pin_capture_mclk = -1
pin_capture_bclk = -1
pin_capture_lrck = -1
pin_din = -1
pin_pdm_clock = -1
pin_amp_enable = -1
codec_i2c_address = 0
mic_i2c_address = 0
playback_rate_hz = 0
playback_channels = 0
capture_rate_hz = 0
capture_channels = 0

[capabilities]
doom = true
audio = false

[compile]
selector = ""
macros = []

# The CST816D is powered from the GPIO1-switched rail, so the probe's reset
# line is that rail: low 20 ms, then high, then 300 ms (the vendor's post-reset
# wait) before addressing 0x15. Released afterwards like every S3 probe.
[detection]
order = 70
resolution = "exactly_one"
no_match = "unknown"
kind = "i2c_any_ack"
flash_min_exclusive = 8388608
flash_max_inclusive = 0
sda = 6
scl = 7
frequency_hz = 100000
scan_first = 0
scan_last = 0
addresses = [21]
reset_pin = 1
reset_low_ms = 20
reset_release_wait_ms = 300
release = "always"
